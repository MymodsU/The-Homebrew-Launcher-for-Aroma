name: Wii U App Cloud Compiler

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Install Wii U dependencies
        run: |
          apt-get update && apt-get install -y doxygen
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S wiiu-dev --noconfirm

      - name: Compile Application via Makefile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=$DEVKITPRO/devkitPPC
          export PATH=$PATH:$DEVKITPPC/bin
          make clean
          make

      - name: Upload Finished Wii U App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: wiiu-launcher-bundle
          path: |
            *.wuhb
            *.rpx

